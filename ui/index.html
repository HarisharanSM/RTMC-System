<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RTMC · Live motion console</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#edf2f7;font:15px system-ui}
header{padding:18px 26px;border-bottom:1px solid #2b3749;display:flex;align-items:center;justify-content:space-between}
h1{font-size:22px;margin:0}small{color:#a8b9ce}iframe{width:100%;height:475px;border:0}
.controls{display:flex;justify-content:space-evenly;gap:20px;align-items:center;padding:18px;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,45px);gap:6px}
button{background:#22334a;border:1px solid #527087;color:white;border-radius:6px;cursor:pointer;touch-action:none}
button:active{background:#267f77}h2{font-size:15px;text-align:center}
#state{color:#5fdfc4}#reason{max-width:350px;line-height:1.5;font-size:13px}
#stop{padding:12px 25px;border-color:#e39475}
</style>
<header><div><h1>RTMC · Live motion</h1><small>Patient-head coordinates · Five axes · Simulation</small></div>
<span id="state">Connecting…</span></header>
<iframe src="/viewer?live=1" title="Live 3D motion and patient reference"></iframe>
<section class="controls">
<div><h2>A4 LAO / A5 CRAN</h2><div class="pad">
<span></span><button data-btn="L-up">CRAN +</button><span></span>
<button data-btn="L-left">LAO +</button><span></span><button data-btn="L-right">LAO −</button>
<span></span><button data-btn="L-down">CRAN −</button><span></span>
</div></div>
<div><p id="reason">Waiting for backend state.</p><button id="stop">Stop / acknowledge</button><p><small>Hold a direction to move. Release to stop.</small></p></div>
<div><h2>X / Y from patient head</h2><div class="pad">
<span></span><button data-btn="R-up">X + feet</button><span></span>
<button data-btn="R-left">Y +</button><span></span><button data-btn="R-right">Y −</button>
<span></span><button data-btn="R-down">X − head</button><span></span>
</div></div>
</section>
<script>
let active=null, generation=0;
let chain=Promise.resolve();
function send(btn,cmd="") {
  // Serialize lifecycle requests; Stop must follow any already issued tick.
  chain=chain.catch(()=>{}).then(async()=>{
    const r=await fetch('/command?btn='+encodeURIComponent(btn)+'&cmd='+cmd,
      {method:'POST',signal:AbortSignal.timeout(500)});
    if(!r.ok)throw Error('Command rejected');
  });return chain;
}
function stop() {active=null;++generation;send('none','stop').catch(()=>{});}
async function start(e) {
  e.preventDefault();if(active)return;
  active=e.currentTarget.dataset.btn;const btn=active,epoch=++generation;
  e.currentTarget.setPointerCapture(e.pointerId);
  try {
    await send(btn,'start');
    while(active===btn && epoch===generation) {
      await new Promise(r=>setTimeout(r,50));
      if(active!==btn || epoch!==generation)break;
      await send(btn);
    }
  } catch(err) {stop();}
}
document.querySelectorAll('[data-btn]').forEach(b=>{
 b.onpointerdown=start;b.onpointerup=stop;b.onpointercancel=stop;
 b.onlostpointercapture=()=>{if(active)stop();};
});
document.getElementById('stop').onclick=stop;
window.addEventListener('blur',()=>{if(active)stop();});
document.addEventListener('visibilitychange',()=>{if(document.hidden && active)stop();});
async function poll() {
 try {
  const r=await fetch('/state',{cache:'no-store',signal:AbortSignal.timeout(500)});
  if(!r.ok)throw Error();const s=await r.json();
  document.getElementById('state').textContent='Collision supervision · '+s.state;
  document.getElementById('state').style.color=s.state.includes('Latched')?'#ffab89':'#5fdfc4';
  document.getElementById('reason').textContent=s.reason+' · Clear permits: '+s.clear_permits;
 } catch(e) {
  document.getElementById('state').textContent='Disconnected · motion status unavailable';
  if(active)stop();
 }
 setTimeout(poll,100);
}poll();
</script>
</html>
