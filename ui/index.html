<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTMC Dual-Joystick Console</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper-left { margin-left: 40px; }
        .wrapper-right { margin-right: 40px; }

        .container-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .left-title { color: #00adb5; }
        .right-title { color: #ff5722; }

        .control-container {
            width: 220px;
            height: 220px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            display: grid;
            grid-template-areas: 
                ".    up    ."
                "left  .    right"
                ".    down  .";
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .left-pad { border-color: #00adb5; }
        .right-pad { border-color: #ff5722; }

        .btn {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease;
            user-select: none;
        }

        .btn:hover { background-color: #3d3d3d; }
        .btn:active { background-color: #00adb5; transform: scale(0.95); }
        .right-pad .btn:active { background-color: #ff5722; }

        .up { grid-area: up; }
        .down { grid-area: down; }
        .left { grid-area: left; }
        .right { grid-area: right; }

        .center-status {
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="wrapper wrapper-left">
        <div class="container-title left-title">LAO/RAO, CRAN/CAUD</div>
        <div class="control-container left-pad">
            <button class="btn up" onmousedown="startHold('L-up')" onmouseup="stopHold()" onmouseleave="stopHold()">▲</button>
            <button class="btn left" onmousedown="startHold('L-left')" onmouseup="stopHold()" onmouseleave="stopHold()">◀</button>
            <button class="btn right" onmousedown="startHold('L-right')" onmouseup="stopHold()" onmouseleave="stopHold()">▶</button>
            <button class="btn down" onmousedown="startHold('L-down')" onmouseup="stopHold()" onmouseleave="stopHold()">▼</button>
        </div>
    </div>

    <div class="center-status">
        <h2>RTMC INTERFACE</h2>
        <div style="color: #00adb5; font-size: 0.9rem;">● STREAM ACTIVE</div>
    </div>

    <div class="wrapper wrapper-right">
        <div class="container-title right-title">X, Y</div>
        <div class="control-container right-pad">
            <button class="btn up" onmousedown="startHold('R-up')" onmouseup="stopHold()" onmouseleave="stopHold()">▲</button>
            <button class="btn left" onmousedown="startHold('R-left')" onmouseup="stopHold()" onmouseleave="stopHold()">◀</button>
            <button class="btn right" onmousedown="startHold('R-right')" onmouseup="stopHold()" onmouseleave="stopHold()">▶</button>
            <button class="btn down" onmousedown="startHold('R-down')" onmouseup="stopHold()" onmouseleave="stopHold()">▼</button>
        </div>
    </div>

    <script>
        let holdInterval = null;

        function transmitSignal(buttonId) {
            const currentUrl = window.location.href;
            const backendUrl = currentUrl.replace("-8000.", "-8082.").split('?')[0];
            const targetAddress = `${backendUrl}?btn=${buttonId}`;

            fetch(targetAddress, {
                method: 'GET',
                mode: 'no-cors'
            }).catch(err => console.log("Stream error omitted."));
        }

        // Called immediately on pointer down
        function startHold(buttonId) {
            if (holdInterval !== null) return; // Prevent duplicate timers

            // 1. Fire the initial single press immediately
            transmitSignal(buttonId);

            // 2. Set up the repeating loop every 50ms for press-and-hold
            holdInterval = setInterval(() => {
                transmitSignal(buttonId);
            }, 50);
        }

        // Called on pointer up or when mouse leaves the button boundaries
        function stopHold() {
            if (holdInterval !== null) {
                clearInterval(holdInterval);
                holdInterval = null;
            }
        }
    </script>
</body>
</html>
